<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Credit Card</title>
    <script src="../../js/creditCard.js" defer></script>
</head>
<body>
    <h1>Edit Credit Card</h1>
    <form id="editCreditCardForm">
        <input type="hidden" id="creditCardId">

        <label for="cardNumber">Card Number:</label>
        <input type="text" id="cardNumber" required><br><br>

        <label for="creditLimit">Credit Limit:</label>
        <input type="number" id="creditLimit" required><br><br>

        <label for="currentBalance">Current Balance:</label>
        <input type="number" id="currentBalance" required><br><br>

        <label for="expiryDate">Expiry Date:</label>
        <input type="date" id="expiryDate" required><br><br>

        <label for="cardType">Card Type:</label>
        <input type="text" id="cardType" required><br><br>

        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
