<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            color: #2c3e50;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        .btn-submit {
            background-color: #3498db;
            border: none;
            padding: 10px 20px;
            font-weight: 500;
        }

            .btn-submit:hover {
                background-color: #2980b9;
            }

        .alert {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="form-title">Create New Transaction</h2>

            <!-- Message Alert -->
            <div id="message" class="alert d-none"></div>

            <form id="createTransactionForm">
                <div class="mb-3">
                    <label for="accountId" class="form-label">Account</label>
                    <select class="form-select" id="accountId" required>
                        <option value="">Select an account</option>
                        <!-- Accounts will be loaded here -->
                    </select>
                </div>

                <div class="mb-3">
                    <label for="type" class="form-label">Transaction Type</label>
                    <select class="form-select" id="type" required>
                        <option value="">Select type</option>
                        <option value="Credit">Credit (Deposit)</option>
                        <option value="Debit">Debit (Withdrawal)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="amount" class="form-label">Amount ($)</label>
                    <input type="number" class="form-control" id="amount" step="0.01" min="0.01" required>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <input type="text" class="form-control" id="description" placeholder="Optional description">
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-submit">
                        <i class="bi bi-check-circle"></i> Create Transaction
                    </button>
                    <a href="../Transactions.html" class="btn btn-outline-secondary" id="backButton">
                        <i class="bi bi-arrow-left"></i> Back to Transactions
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // API Configuration
        const API_BASE_URL = 'https://localhost:7256/api';
        const ACCOUNTS_URL = `${API_BASE_URL}/accounts`;
        const TRANSACTIONS_URL = `${API_BASE_URL}/transactions`;

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            // Set default date to today
            document.getElementById('date').valueAsDate = new Date();

            // Load accounts dropdown
            loadAccounts();

            // Setup form submission
            document.getElementById('createTransactionForm').addEventListener('submit', handleFormSubmit);
        });

        // Load accounts into dropdown
        async function loadAccounts() {
            try {
                showMessage('Loading accounts...', 'info');
                const response = await fetch(ACCOUNTS_URL);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const accounts = await response.json();
                const accountSelect = document.getElementById('accountId');

                // Clear existing options
                accountSelect.innerHTML = '<option value="">Select an account</option>';

                // Add account options
                accounts.forEach(account => {
                    const option = document.createElement('option');
                    option.value = account.id;
                    option.textContent = `${account.accountNumber} (${account.accountType}) - $${account.balance.toFixed(2)}`;
                    accountSelect.appendChild(option);
                });

                // Hide the message when accounts are loaded
                document.getElementById('message').classList.add('d-none');

            } catch (error) {
                showMessage(`Failed to load accounts: ${error.message}`, 'danger');
                console.error('Account loading error:', error);
            }
        }

        // Handle form submission
        async function handleFormSubmit(event) {
            event.preventDefault();

            // Get form elements
            const form = event.target;
            const accountId = form.accountId.value;
            const amount = parseFloat(form.amount.value);
            const date = form.date.value;
            const type = form.type.value;
            const description = form.description.value;

            // Validate inputs
            if (!accountId) {
                showMessage('Please select an account', 'danger');
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                showMessage('Please enter a valid positive amount', 'danger');
                return;
            }

            if (!date) {
                showMessage('Please select a date', 'danger');
                return;
            }

            if (!type || !['Credit', 'Debit'].includes(type)) {
                showMessage('Please select a valid transaction type', 'danger');
                return;
            }

            // Prepare transaction data
            const transactionData = {
                accountId: parseInt(accountId),
                amount: amount,
                date: date,
                type: type,
                description: description || null
            };

            showMessage('Creating transaction...', 'info');

            // Submit to server
            try {
                const response = await fetch(TRANSACTIONS_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(transactionData)
                });

                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                let result;

                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                } else {
                    const text = await response.text();
                    throw new Error(text || 'Invalid server response');
                }

                if (!response.ok) {
                    throw new Error(result.message || 'Transaction failed');
                }

                // Success handling
                showMessage(
                    `Transaction successful! New balance: $${result.newBalance.toFixed(2)}`,
                    'success'
                );

                // Store a flag in sessionStorage to indicate a new transaction was created
                sessionStorage.setItem('transactionCreated', 'true');
                sessionStorage.setItem('transactionMessage', `Transaction #${result.transactionId} created successfully.`);

                // Redirect back to transactions page after 2 seconds
                setTimeout(() => {
                    window.location.href = '../Transactions.html';
                }, 2000);

            } catch (error) {
                console.error('Transaction error:', error);
                showMessage(
                    `Transaction failed: ${error.message}`,
                    'danger'
                );
            }
        }

        // Show message to user
        function showMessage(message, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `alert alert-${type} d-block`;

            // Auto-hide success and info messages after 5 seconds
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    messageEl.classList.add('d-none');
                }, 5000);
            }
        }
    </script>
</body>
</html>
