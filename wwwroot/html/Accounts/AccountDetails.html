<!DOCTYPE html>
<html lang="en">
<head>
    <title>Account Details</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .account-header {
            background-color: #2c3e50;
            margin-top: 56px;
            color: white;
            padding: 2rem 0;
        }

        .account-card {
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

            .account-card .card-header {
                background-color: #3498db;
                color: white;
                font-weight: bold;
            }

        .detail-row {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-label {
            font-weight: 600;
            color: #7f8c8d;
        }

        .detail-value {
            font-weight: 500;
        }

        .balance-display {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .positive-balance {
            color: #28a745;
        }

        .negative-balance {
            color: #dc3545;
        }

        .action-buttons {
            margin-top: 30px;
        }

        #notificationArea {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 1050;
            max-width: 350px;
        }

        .loading-spinner {
            text-align: center;
            margin: 40px 0;
        }
    </style>
</head>
<body>
    <!-- Navbar (consistent with other pages) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="../html/index.html">Banking App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="../html/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../html/Accounts.html">Accounts</a>
                    </li>
                    <!-- Other nav items -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="container-fluid account-header">
        <div class="container text-center py-3">
            <h2 class="text-white display-4 mb-3">Account Details</h2>
        </div>
    </div>

    <!-- Notification Area -->
    <div id="notificationArea"></div>

    <div class="container mt-4">
        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading account details...</p>
        </div>

        <!-- Account Details Card -->
        <div class="card account-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Account Information</span>
                <button id="refreshButton" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
            <div class="card-body" id="accountDetails">
                <!-- Details will be loaded here by JavaScript -->
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons d-flex justify-content-between">
            <a href="../Accounts.html" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Accounts
            </a>
            <div>
                <a id="editLink" href="../html/EditAccount.html?id=" class="btn btn-primary me-2">
                    <i class="bi bi-pencil"></i> Edit Account
                </a>
                <button id="deleteButton" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Delete Account
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- JavaScript -->
    <script>
        // API Configuration
        const ACCOUNTS_API_URL = 'https://localhost:7256/api/accounts';

        // Get account ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const accountId = urlParams.get('id');

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            if (!accountId) {
                showNotification('No account ID provided', 'danger');
                return;
            }

            // Set up edit link
            document.getElementById('editLink').href += accountId;

            // Set up delete button
            document.getElementById('deleteButton').addEventListener('click', deleteAccount);

            // Set up refresh button
            document.getElementById('refreshButton').addEventListener('click', loadAccountDetails);

            // Load initial data
            loadAccountDetails();
        });

        async function loadAccountDetails() {
            try {
                showLoadingState(true);
                clearAccountDetails();

                const response = await fetch(`${ACCOUNTS_API_URL}/${accountId}`);

                if (!response.ok) {
                    throw new Error(`Failed to load account: ${response.status}`);
                }

                const account = await response.json();
                renderAccountDetails(account);

            } catch (error) {
                console.error('Error loading account:', error);
                showNotification(`Error: ${error.message}`, 'danger');
            } finally {
                showLoadingState(false);
            }
        }

        function renderAccountDetails(account) {
            const accountDetails = document.getElementById('accountDetails');
            const balanceClass = account.balance >= 0 ? 'positive-balance' : 'negative-balance';

            accountDetails.innerHTML = `
                    <div class="detail-row">
                        <div class="row">
                            <div class="col-md-3 detail-label">Account Number:</div>
                            <div class="col-md-9 detail-value">${account.accountNumber}</div>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="row">
                            <div class="col-md-3 detail-label">Account Type:</div>
                            <div class="col-md-9 detail-value">
                                <span class="badge bg-secondary">${account.accountType}</span>
                            </div>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="row">
                            <div class="col-md-3 detail-label">Balance:</div>
                            <div class="col-md-9 detail-value">
                                <span class="balance-display ${balanceClass}">$${account.balance.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="row">
                            <div class="col-md-3 detail-label">Opened On:</div>
                            <div class="col-md-9 detail-value">${formatDate(account.createdDate)}</div>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="row">
                            <div class="col-md-3 detail-label">Transactions:</div>
                            <div class="col-md-9 detail-value">${account.transactions?.length || 0}</div>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="row">
                            <div class="col-md-3 detail-label">Investments:</div>
                            <div class="col-md-9 detail-value">${account.investments?.length || 0}</div>
                        </div>
                    </div>
                `;
        }

        async function deleteAccount() {
            if (!confirm('Are you sure you want to delete this account?\nThis action cannot be undone.')) {
                return;
            }

            try {
                const button = document.getElementById('deleteButton');
                button.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Deleting...';
                button.disabled = true;

                const response = await fetch(`${ACCOUNTS_API_URL}/${accountId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error(`Failed to delete account: ${response.status}`);
                }

                showNotification('Account deleted successfully', 'success');
                setTimeout(() => {
                    window.location.href = '../html/Accounts.html';
                }, 1500);

            } catch (error) {
                console.error('Error deleting account:', error);
                showNotification(`Delete failed: ${error.message}`, 'danger');
                document.getElementById('deleteButton').innerHTML = '<i class="bi bi-trash"></i> Delete Account';
                document.getElementById('deleteButton').disabled = false;
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function showLoadingState(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
        }

        function clearAccountDetails() {
            document.getElementById('accountDetails').innerHTML = '';
        }

        function showNotification(message, type = 'info') {
            const notificationArea = document.getElementById('notificationArea');
            notificationArea.innerHTML = '';

            const toast = document.createElement('div');
            toast.className = `toast show alert alert-${type}`;
            toast.innerHTML = `
                    <div class="toast-header">
                        <strong class="me-auto">${type.charAt(0).toUpperCase() + type.slice(1)}</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                    </div>
                    <div class="toast-body">${message}</div>
                `;

            notificationArea.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }
    </script>
</body>
</html>
