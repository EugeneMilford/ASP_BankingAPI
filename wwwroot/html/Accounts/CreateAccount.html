<!-- CreateAccount.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Create New Account</h1>
        <form id="createAccountForm">
            <div class="mb-3">
                <label for="accountNumber" class="form-label">Account Number</label>
                <input type="text" class="form-control" id="accountNumber" required>
            </div>
            <div class="mb-3">
                <label for="accountType" class="form-label">Account Type</label>
                <select class="form-select" id="accountType" required>
                    <option value="savings">Savings</option>
                    <option value="checking">Checking</option>
                    <option value="business">Business</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="initialBalance" class="form-label">Initial Balance</label>
                <input type="number" class="form-control" id="initialBalance" required>
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
    </div>

    <script>
        document.getElementById('createAccountForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const accountNumber = document.getElementById('accountNumber').value;
            const accountType = document.getElementById('accountType').value;
            const initialBalance = parseFloat(document.getElementById('initialBalance').value);

            try {
                const response = await fetch('https://localhost:7256/api/accounts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ accountNumber, accountType, balance: initialBalance })
                });

                if (!response.ok) throw new Error(`Failed to create account: ${response.status}`);

                const newAccount = await response.json();

                // Store the new account details in session storage
                sessionStorage.setItem('newAccount', JSON.stringify(newAccount));

                // Redirect to accounts page
                window.location.href = 'Accounts.html';
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        });
    </script>
</body>
</html>
