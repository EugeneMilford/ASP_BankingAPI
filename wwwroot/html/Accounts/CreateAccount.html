<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Accounts</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="../../css/Banking.css" rel="stylesheet" />
</head>
<body>
    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Banking App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="../Accounts.html" class="nav-item nav-link">Accounts</a>
                    </li>
                    <li class="nav-item">
                        <a href="../Transactions.html" class="nav-item nav-link">Transactions</a>
                    </li>
                    <li class="nav-item">
                        <a href="../CreditCards.html" class="nav-item nav-link">Credit</a>
                    </li>
                    <li class="nav-item">
                        <a href="../Bills.html" class="nav-item nav-link">Bill Payments</a>
                    </li>
                    <li class="nav-item">
                        <a href="../Contact.html" class="nav-item nav-link">Contact</a>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Page Header Start -->
    <div class="container-fluid page-header mb-5 wow fadeIn" data-wow-delay="0.1s">
        <div class="container">
            <h1 class="display-3 mb-4 animated slideInDown">Create Account</h1>
            <nav aria-label="breadcrumb animated slideInDown">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="../html/index.html">Home</a></li>
                    <li class="breadcrumb-item"><a href="../Accounts.html">Accounts</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Create</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container">
        <h1 class="mb-4">Create New Account</h1>
        <form id="createAccountForm">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="accountNumber" class="form-label">Account Number:</label>
                    <input type="text" class="form-control" id="accountNumber" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="balance" class="form-label">Balance:</label>
                    <input type="number" class="form-control" id="balance" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="accountType" class="form-label">Account Type:</label>
                    <input type="text" class="form-control" id="accountType" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </div>
        </form>
        <a href="../Accounts.html">Back to List</a>
    </div>
    
    <br />
    <!-- Copyright Start -->
    <div class="container-fluid copyright py-4" style="background-color: #007896;">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    &copy; 2024 All Right Reserved.
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/account.js"></script>
</body>
</html>
