<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Budget Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }

        .details-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .details-title {
            color: #2c3e50;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        .detail-row {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .detail-label {
            font-weight: 500;
            color: #6c757d;
        }

        .detail-value {
            font-weight: 400;
        }

        .positive-budget {
            color: #28a745;
        }

        .negative-budget {
            color: #dc3545;
        }

        .progress {
            height: 25px;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1040;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="container">
        <div class="details-container">
            <h2 class="details-title">Budget Tool Details</h2>

            <!-- Message Alert -->
            <div id="message" class="alert d-none"></div>

            <!-- Finance Tool Details -->
            <div id="financeToolDetails">
                <div class="detail-row row">
                    <div class="col-md-4 detail-label">Account:</div>
                    <div class="col-md-8 detail-value" id="accountNumber">Loading...</div>
                </div>
                <div class="detail-row row">
                    <div class="col-md-4 detail-label">Monthly Budget:</div>
                    <div class="col-md-8 detail-value" id="budget">Loading...</div>
                </div>
                <div class="detail-row row">
                    <div class="col-md-4 detail-label">Current Expenses:</div>
                    <div class="col-md-8 detail-value" id="expenses">Loading...</div>
                </div>
                <div class="detail-row row">
                    <div class="col-md-4 detail-label">Remaining Budget:</div>
                    <div class="col-md-8 detail-value" id="remainingBudget">Loading...</div>
                </div>
                <div class="detail-row row">
                    <div class="col-md-4 detail-label">Budget Utilization:</div>
                    <div class="col-md-8 detail-value" id="progressBar">
                        <div class="progress">
                            <div class="progress-bar"
                                 role="progressbar"
                                 style="width: 0%"
                                 aria-valuenow="0"
                                 aria-valuemin="0"
                                 aria-valuemax="100">
                                0%
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-grid gap-2 mt-4">
                <a href="../FinanceTools.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Finance Tools
                </a>
                <button class="btn btn-outline-danger" id="deleteButton">
                    <i class="bi bi-trash"></i> Delete Budget Tool
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // API Configuration
        const API_BASE_URL = 'https://localhost:7256/api';
        const FINANCE_TOOLS_URL = `${API_BASE_URL}/personalfinancetools`;

        // Get finance tool ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const personalId = urlParams.get('id');

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            if (!personalId) {
                showMessage('No budget tool ID provided', 'danger');
                return;
            }

            // Load finance tool details
            loadFinanceToolDetails();

            // Setup delete button
            document.getElementById('deleteButton').addEventListener('click', deleteFinanceTool);
        });

        // Load finance tool details
        async function loadFinanceToolDetails() {
            try {
                showLoading(true);

                const response = await fetch(`${FINANCE_TOOLS_URL}/${personalId}`);

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }

                const data = await response.json();

                if (!data.success || !data.tool) {
                    throw new Error(data.message || 'Budget tool not found');
                }

                const tool = data.tool;

                // Calculate remaining budget
                const remaining = tool.budget - tool.expenses;
                const remainingClass = remaining >= 0 ? 'positive-budget' : 'negative-budget';
                const remainingSign = remaining >= 0 ? '' : '-';

                // Calculate progress percentage
                const progressPercentage = Math.min(100, (tool.expenses / tool.budget) * 100);
                const progressClass = progressPercentage >= 100 ? 'bg-danger' :
                                    progressPercentage >= 75 ? 'bg-warning' : 'bg-success';

                // Populate details
                document.getElementById('accountNumber').textContent =
                    `${tool.accountNumber || 'N/A'} (Account ID: ${tool.accountId})`;
                document.getElementById('budget').textContent =
                    `$${formatCurrency(tool.budget)}`;
                document.getElementById('expenses').textContent =
                    `$${formatCurrency(tool.expenses)}`;
                document.getElementById('remainingBudget').innerHTML =
                    `<span class="${remainingClass}">${remainingSign}$${formatCurrency(Math.abs(remaining))}</span>`;

                // Update progress bar
                const progressBar = document.querySelector('#progressBar .progress-bar');
                progressBar.style.width = `${progressPercentage}%`;
                progressBar.classList.add(progressClass);
                progressBar.setAttribute('aria-valuenow', progressPercentage);
                progressBar.textContent = `${Math.round(progressPercentage)}%`;

            } catch (error) {
                console.error('Error loading budget tool details:', error);
                showMessage(`Failed to load budget tool: ${error.message}`, 'danger');
                document.getElementById('financeToolDetails').innerHTML = `
                    <div class="alert alert-danger">
                        Error loading budget tool details: ${error.message}
                    </div>
                `;
            } finally {
                showLoading(false);
            }
        }

        // Delete finance tool
        async function deleteFinanceTool() {
            if (!confirm('Are you sure you want to delete this budget tool?\nThis action cannot be undone.')) {
                return;
            }

            try {
                showLoading(true);
                const button = document.getElementById('deleteButton');
                const originalText = button.innerHTML;

                button.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Deleting...';
                button.disabled = true;

                const response = await fetch(`${FINANCE_TOOLS_URL}/${personalId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }

                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || 'Failed to delete budget tool');
                }

                showMessage('Budget tool deleted successfully', 'success');

                // Redirect back to finance tools page after 2 seconds
                setTimeout(() => {
                    window.location.href = '../FinanceTools.html';
                }, 2000);

            } catch (error) {
                console.error('Error deleting budget tool:', error);
                showMessage(`Failed to delete budget tool: ${error.message}`, 'danger');
            } finally {
                const button = document.getElementById('deleteButton');
                if (button) {
                    button.innerHTML = '<i class="bi bi-trash"></i> Delete Budget Tool';
                    button.disabled = false;
                }
                showLoading(false);
            }
        }

        function formatCurrency(amount) {
            return parseFloat(amount).toFixed(2);
        }

        // Show loading overlay
        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        // Show message to user
        function showMessage(message, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `alert alert-${type} d-block`;

            // Auto-hide success and info messages after 5 seconds
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    messageEl.classList.add('d-none');
                }, 5000);
            }
        }
    </script>
</body>
</html>
