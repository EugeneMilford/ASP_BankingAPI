<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 5rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-floating label {
            padding-left: 3rem;
        }

        .form-floating .bi {
            position: absolute;
            top: 1.1rem;
            left: 1.25rem;
            font-size: 1.25rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- Navbar would be included here -->

    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h2><i class="bi bi-lock"></i> Login to Your Account</h2>
                <p class="text-muted">Enter your credentials to access your banking services</p>
            </div>

            <div id="loginMessage" class="alert d-none"></div>

            <form id="loginForm">
                <div class="form-floating mb-3">
                    <i class="bi bi-envelope"></i>
                    <input type="email" class="form-control ps-5" id="email" placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>

                <div class="form-floating mb-3">
                    <i class="bi bi-key"></i>
                    <input type="password" class="form-control ps-5" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>

                <div class="d-flex justify-content-between mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="text-decoration-none">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Login</button>

                <div class="text-center">
                    <p class="text-muted">Don't have an account? <a href="register.html" class="text-decoration-none">Register here</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            const messageEl = document.getElementById('loginMessage');
            messageEl.classList.add('d-none');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Login failed');
                }

                // Store token and user data
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                if (rememberMe) {
                    localStorage.setItem('rememberMe', 'true');
                } else {
                    sessionStorage.setItem('authToken', data.token);
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                }

                // Redirect to dashboard
                window.location.href = 'dashboard.html';

            } catch (error) {
                messageEl.textContent = error.message;
                messageEl.classList.remove('d-none', 'alert-success');
                messageEl.classList.add('alert-danger');
            }
        });
    </script>
</body>
</html>
