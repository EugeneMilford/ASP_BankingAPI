<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Support Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .form-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="text-center mb-4">Create Support Ticket</h2>
            <div id="message" class="alert d-none"></div>

            <form id="createTicketForm">
                <div class="mb-3">
                    <label for="accountId" class="form-label">Account</label>
                    <select class="form-select" id="accountId" required>
                        <option value="">Select an account</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="issueDescription" class="form-label">Issue Description</label>
                    <textarea class="form-control" id="issueDescription" rows="5" required></textarea>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Create Ticket
                    </button>
                    <a href="../SupportTickets.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Back to Tickets
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const TICKETS_API_URL = '/api/tickets';
        const ACCOUNTS_API_URL = '/api/accounts';

        document.addEventListener('DOMContentLoaded', function () {
            loadAccounts();
            setupForm();
        });

        async function loadAccounts() {
            try {
                const response = await fetch(ACCOUNTS_API_URL);
                if (!response.ok) throw new Error('Failed to load accounts');

                const accounts = await response.json();
                const select = document.getElementById('accountId');

                accounts.forEach(account => {
                    const option = document.createElement('option');
                    option.value = account.id;
                    option.textContent = `${account.accountNumber} (${account.accountType})`;
                    select.appendChild(option);
                });
            } catch (error) {
                showMessage(error.message, 'danger');
            }
        }

        function setupForm() {
            document.getElementById('createTicketForm').addEventListener('submit', async function (e) {
                e.preventDefault();

                const button = e.target.querySelector('button[type="submit"]');
                const originalText = button.innerHTML;

                try {
                    button.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';
                    button.disabled = true;

                    const accountId = document.getElementById('accountId').value;
                    const issueDescription = document.getElementById('issueDescription').value.trim();

                    if (!accountId || !issueDescription) {
                        throw new Error('Please fill all fields');
                    }

                    const response = await fetch(TICKETS_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            accountId: parseInt(accountId),
                            issueDescription: issueDescription
                        })
                    });

                    if (!response.ok) throw new Error(await response.text());

                    const result = await response.json();
                    if (!result.success) throw new Error(result.message);

                    // Store the new ticket data before redirecting
                    sessionStorage.setItem('newTicket', JSON.stringify(result.ticket));
                    sessionStorage.setItem('notification', 'Ticket created successfully');

                    window.location.href = '../SupportTickets.html';

                } catch (error) {
                    showMessage(error.message, 'danger');
                } finally {
                    button.innerHTML = originalText;
                    button.disabled = false;
                }
            });
        }

        function showMessage(message, type) {
            const el = document.getElementById('message');
            el.textContent = message;
            el.className = `alert alert-${type} d-block`;
        }
    </script>
</body>
</html>
