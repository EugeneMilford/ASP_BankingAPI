<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .ticket-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .status-badge {
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .bg-success {
            background-color: #28a745 !important;
        }

        .bg-warning {
            background-color: #ffc107 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ticket-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Ticket Details</h2>
                <span id="ticketStatus" class="status-badge bg-warning">Open</span>
            </div>

            <div id="ticketContent">
                <!-- Content will be loaded dynamically -->
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="SupportTickets.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Tickets
                </a>
                <div>
                    <button id="resolveBtn" class="btn btn-primary me-2">
                        <i class="bi bi-check-circle"></i> Resolve
                    </button>
                    <button id="deleteBtn" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Resolve Modal -->
    <div class="modal fade" id="resolveModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Resolve Ticket</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <textarea id="resolutionText" class="form-control" rows="5" placeholder="Enter resolution details..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirmResolve">Resolve</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const TICKETS_API_URL = '/api/tickets';
        const ticketId = new URLSearchParams(window.location.search).get('id');

        document.addEventListener('DOMContentLoaded', function () {
            if (!ticketId) {
                showError('Invalid ticket ID');
                return;
            }

            loadTicket();
            setupEventListeners();
        });

        async function loadTicket() {
            try {
                const response = await fetch(`${TICKETS_API_URL}/${ticketId}`);
                if (!response.ok) throw new Error(await response.text());

                const data = await response.json();
                if (!data.success) throw new Error(data.message);

                renderTicket(data.ticket);
            } catch (error) {
                showError(error.message);
            }
        }

        function renderTicket(ticket) {
            document.getElementById('ticketStatus').textContent = ticket.isResolved ? 'Resolved' : 'Open';
            document.getElementById('ticketStatus').className = `status-badge ${ticket.isResolved ? 'bg-success' : 'bg-warning'}`;

            document.getElementById('ticketContent').innerHTML = `
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <h5>Account</h5>
                            <p>${ticket.accountNumber || 'N/A'} (ID: ${ticket.accountId})</p>
                        </div>
                        <div class="col-md-6">
                            <h5>Created</h5>
                            <p>${new Date(ticket.createdDate).toLocaleString()}</p>
                        </div>
                    </div>

                    <div class="mb-3">
                        <h5>Description</h5>
                        <div class="card card-body bg-light">
                            <p>${ticket.issueDescription}</p>
                        </div>
                    </div>

                    ${ticket.isResolved ? `
                    <div class="mb-3">
                        <h5>Resolution</h5>
                        <div class="card card-body bg-light">
                            <p>${ticket.resolution}</p>
                        </div>
                    </div>
                    ` : ''}
                `;

            document.getElementById('resolveBtn').style.display = ticket.isResolved ? 'none' : 'block';
        }

        function setupEventListeners() {
            document.getElementById('resolveBtn').addEventListener('click', () => {
                new bootstrap.Modal(document.getElementById('resolveModal')).show();
            });

            document.getElementById('confirmResolve').addEventListener('click', resolveTicket);
            document.getElementById('deleteBtn').addEventListener('click', deleteTicket);
        }

        async function resolveTicket() {
            const resolution = document.getElementById('resolutionText').value.trim();
            if (!resolution) {
                alert('Please enter resolution details');
                return;
            }

            try {
                const button = document.getElementById('confirmResolve');
                button.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';
                button.disabled = true;

                const response = await fetch(`${TICKETS_API_URL}/${ticketId}/Resolve`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resolution })
                });

                if (!response.ok) throw new Error(await response.text());

                const result = await response.json();
                if (!result.success) throw new Error(result.message);

                bootstrap.Modal.getInstance(document.getElementById('resolveModal')).hide();
                loadTicket();

            } catch (error) {
                alert(error.message);
            } finally {
                const button = document.getElementById('confirmResolve');
                button.innerHTML = 'Resolve';
                button.disabled = false;
            }
        }

        async function deleteTicket() {
            if (!confirm('Are you sure you want to delete this ticket?')) return;

            try {
                const button = document.getElementById('deleteBtn');
                button.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Deleting...';
                button.disabled = true;

                const response = await fetch(`${TICKETS_API_URL}/${ticketId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error(await response.text());

                const result = await response.json();
                if (!result.success) throw new Error(result.message);

                window.location.href = 'SupportTickets.html';

            } catch (error) {
                alert(error.message);
            }
        }

        function showError(message) {
            document.getElementById('ticketContent').innerHTML = `
                    <div class="alert alert-danger">
                        <p>${message}</p>
                    </div>
                `;
        }
    </script>
</body>
</html>
