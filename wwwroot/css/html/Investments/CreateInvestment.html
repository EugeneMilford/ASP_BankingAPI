<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Investment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            color: #2c3e50;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        .btn-submit {
            background-color: #3498db;
            border: none;
            padding: 10px 20px;
            font-weight: 500;
        }

            .btn-submit:hover {
                background-color: #2980b9;
            }

        .alert {
            transition: all 0.3s ease;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1040;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="container">
        <div class="form-container">
            <h2 class="form-title">Create New Investment</h2>

            <!-- Message Alert -->
            <div id="message" class="alert d-none"></div>

            <form id="createInvestmentForm">
                <div class="mb-3">
                    <label for="accountId" class="form-label">Account</label>
                    <select class="form-select" id="accountId" required>
                        <option value="">Select an account</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="investmentAmount" class="form-label">Investment Amount ($)</label>
                    <input type="number" class="form-control" id="investmentAmount" step="0.01" min="0.01" required>
                </div>

                <div class="mb-3">
                    <label for="currentValue" class="form-label">Current Value ($)</label>
                    <input type="number" class="form-control" id="currentValue" step="0.01" min="0.01" required>
                    <small class="text-muted">Leave same as investment amount if just starting</small>
                </div>

                <div class="mb-3">
                    <label for="investmentType" class="form-label">Investment Type</label>
                    <select class="form-select" id="investmentType" required>
                        <option value="">Select type</option>
                        <option value="Stocks">Stocks</option>
                        <option value="Bonds">Bonds</option>
                        <option value="Mutual Funds">Mutual Funds</option>
                        <option value="ETF">ETF</option>
                        <option value="Real Estate">Real Estate</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="investmentDate" class="form-label">Investment Date</label>
                    <input type="date" class="form-control" id="investmentDate" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description (Optional)</label>
                    <textarea class="form-control" id="description" rows="2"></textarea>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-submit" id="submitButton">
                        <i class="bi bi-check-circle"></i> Create Investment
                    </button>
                    <a href="../Investments.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Back to Investments
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // API Configuration
        const API_BASE_URL = 'https://localhost:7256/api';
        const INVESTMENTS_URL = `${API_BASE_URL}/investments`;
        const ACCOUNTS_URL = `${API_BASE_URL}/accounts`;

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            // Set default date to today
            document.getElementById('investmentDate').valueAsDate = new Date();

            // Set current value to match investment amount by default
            document.getElementById('investmentAmount').addEventListener('input', function() {
                const currentValueField = document.getElementById('currentValue');
                if (!currentValueField.value || currentValueField.value === document.getElementById('investmentAmount').value) {
                    currentValueField.value = this.value;
                }
            });

            // Load accounts dropdown
            loadAccounts();

            // Setup form submission
            document.getElementById('createInvestmentForm').addEventListener('submit', handleFormSubmit);
        });

        // Load accounts into dropdown
        async function loadAccounts() {
            try {
                showLoading(true);
                showMessage('Loading accounts...', 'info');
                const response = await fetch(ACCOUNTS_URL);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const accounts = await response.json();
                const accountSelect = document.getElementById('accountId');

                // Clear existing options
                accountSelect.innerHTML = '<option value="">Select an account</option>';

                // Add account options
                accounts.forEach(account => {
                    const option = document.createElement('option');
                    option.value = account.id;
                    option.textContent = `${account.accountNumber} (${account.accountType}) - $${account.balance.toFixed(2)}`;
                    accountSelect.appendChild(option);
                });

                // Hide the message when accounts are loaded
                document.getElementById('message').classList.add('d-none');

            } catch (error) {
                showMessage(`Failed to load accounts: ${error.message}`, 'danger');
                console.error('Account loading error:', error);
            } finally {
                showLoading(false);
            }
        }

        // Handle form submission
        async function handleFormSubmit(event) {
            event.preventDefault();

            // Get form elements and submit button
            const form = event.target;
            const submitButton = document.getElementById('submitButton');
            const originalButtonText = submitButton.innerHTML;

            // Set loading state
            submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing...';
            submitButton.disabled = true;
            showLoading(true);

            // Get form values
            const accountId = form.accountId.value;
            const investmentAmount = parseFloat(form.investmentAmount.value);
            const currentValue = parseFloat(form.currentValue.value);
            const investmentType = form.investmentType.value;
            const investmentDate = form.investmentDate.value;
            const description = form.description.value;

            // Validate inputs
            if (!accountId) {
                showMessage('Please select an account', 'danger');
                resetSubmitButton(submitButton, originalButtonText);
                return;
            }

            if (isNaN(investmentAmount) || investmentAmount <= 0) {
                showMessage('Please enter a valid investment amount', 'danger');
                resetSubmitButton(submitButton, originalButtonText);
                return;
            }

            if (isNaN(currentValue) || currentValue <= 0) {
                showMessage('Please enter a valid current value', 'danger');
                resetSubmitButton(submitButton, originalButtonText);
                return;
            }

            if (!investmentType) {
                showMessage('Please select an investment type', 'danger');
                resetSubmitButton(submitButton, originalButtonText);
                return;
            }

            if (!investmentDate) {
                showMessage('Please select an investment date', 'danger');
                resetSubmitButton(submitButton, originalButtonText);
                return;
            }

            // Prepare investment data
            const investmentData = {
                accountId: parseInt(accountId),
                investmentAmount: investmentAmount,
                currentValue: currentValue,
                investmentType: investmentType,
                investmentDate: investmentDate,
                description: description || null
            };

            showMessage('Creating investment...', 'info');

            // Submit to server
            try {
                const response = await fetch(INVESTMENTS_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(investmentData)
                });

                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                let result;

                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                } else {
                    const text = await response.text();
                    throw new Error(text || 'Invalid server response');
                }

                if (!response.ok) {
                    throw new Error(result.message || 'Investment creation failed');
                }

                // Success handling
                showMessage(
                    `Investment created successfully! Investment ID: ${result.investmentId}`,
                    'success'
                );

                // Store investment data in sessionStorage
                sessionStorage.setItem('investmentCreated', 'true');
                sessionStorage.setItem('investmentMessage', `Investment #${result.investmentId} created successfully.`);
                sessionStorage.setItem('newInvestmentData', JSON.stringify({
                    investmentId: result.investmentId,
                    accountId: result.accountId,
                    accountNumber: result.accountNumber,
                    investmentAmount: investmentAmount,
                    currentValue: currentValue,
                    investmentType: investmentType,
                    investmentDate: investmentDate,
                    returns: currentValue - investmentAmount
                }));

                // Redirect back to investments page after 2 seconds
                setTimeout(() => {
                    window.location.href = '../Investments.html';
                }, 2000);

            } catch (error) {
                console.error('Investment creation error:', error);
                let errorMessage = 'Investment creation failed';

                try {
                    const errorResponse = JSON.parse(error.message);
                    errorMessage = errorResponse.message || errorMessage;
                } catch (e) {
                    errorMessage = error.message || errorMessage;
                }

                showMessage(errorMessage, 'danger');
            } finally {
                resetSubmitButton(submitButton, originalButtonText);
                showLoading(false);
            }
        }

        function resetSubmitButton(button, originalText) {
            button.innerHTML = originalText;
            button.disabled = false;
            showLoading(false);
        }

        // Show loading overlay
        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        // Show message to user
        function showMessage(message, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `alert alert-${type} d-block`;

            // Auto-hide success and info messages after 5 seconds
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    messageEl.classList.add('d-none');
                }, 5000);
            }
        }
    </script>
</body>
</html>
