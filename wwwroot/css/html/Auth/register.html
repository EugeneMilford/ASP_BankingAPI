<!DOCTYPE html>
-
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .auth-container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .role-radio-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .role-radio-option {
            flex: 1;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 1rem;
            cursor: pointer;
        }

            .role-radio-option input[type="radio"] {
                margin-right: 0.5rem;
            }

            .role-radio-option.active {
                border-color: #0d6efd;
                background-color: #f8f9fa;
            }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h2><i class="bi bi-person-plus"></i> Create Your Account</h2>
                <p class="text-muted">Join SecureBank today for secure and convenient banking</p>
            </div>

            <div id="registerMessage" class="alert d-none"></div>

            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="mb-3">
                    <label for="dob" class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" id="dob" required>
                </div>

                <!-- Role Selection (Radio Buttons) -->
                <div class="mb-3">
                    <label class="form-label">Account Type</label>
                    <div class="role-radio-group">
                        <label class="role-radio-option">
                            <input type="radio" name="userRole" value="User" checked>
                            <i class="bi bi-person"></i> Regular User
                            <p class="text-muted small mt-1">Standard banking access</p>
                        </label>
                        <label class="role-radio-option">
                            <input type="radio" name="userRole" value="Admin">
                            <i class="bi bi-shield-lock"></i> Administrator
                            <p class="text-muted small mt-1">Full system access</p>
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                    <div class="form-text">Minimum 8 characters with at least one number and one special character</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="#" class="text-decoration-none">Terms and Conditions</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Create Account</button>

                <div class="text-center">
                    <p class="text-muted">Already have an account? <a href="login.html" class="text-decoration-none">Login here</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Add active class to selected role option
        document.querySelectorAll('.role-radio-option').forEach(option => {
            option.addEventListener('click', function () {
                document.querySelectorAll('.role-radio-option').forEach(opt => {
                    opt.classList.remove('active');
                });
                this.classList.add('active');
                this.querySelector('input[type="radio"]').checked = true;
            });
        });

        // Initialize with User role selected
        document.querySelector('.role-radio-option:first-child').classList.add('active');

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const dob = document.getElementById('dob').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const userRole = document.querySelector('input[name="userRole"]:checked').value;

            const messageEl = document.getElementById('registerMessage');
            messageEl.classList.add('d-none');

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'danger');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        firstName,
                        lastName,
                        email,
                        dateOfBirth: dob,
                        password,
                        userRole
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Registration failed');
                }

                showMessage('Registration successful! Redirecting to login...', 'success');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                showMessage(error.message, 'danger');
            }
        });

        function showMessage(message, type) {
            const messageEl = document.getElementById('registerMessage');
            messageEl.textContent = message;
            messageEl.classList.remove('d-none', 'alert-success', 'alert-danger');
            messageEl.classList.add(`alert-${type}`);
        }
    </script>
</body>
</html>
