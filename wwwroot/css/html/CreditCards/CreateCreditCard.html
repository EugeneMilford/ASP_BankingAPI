<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Credit Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            color: #2c3e50;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        .btn-submit {
            background-color: #3498db;
            border: none;
            padding: 10px 20px;
            font-weight: 500;
        }

            .btn-submit:hover {
                background-color: #2980b9;
            }

        .alert {
            transition: all 0.3s ease;
        }

        .form-label {
            font-weight: 500;
        }

        .card-number-input {
            letter-spacing: 2px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="form-title">Add New Credit Card</h2>

            <!-- Message Alert -->
            <div id="message" class="alert d-none"></div>

            <form id="createCreditCardForm">
                <div class="mb-3">
                    <label for="accountId" class="form-label">Linked Account</label>
                    <select class="form-select" id="accountId" required>
                        <option value="">Select an account</option>
                        <!-- Accounts will be loaded here -->
                    </select>
                </div>

                <div class="mb-3">
                    <label for="cardNumber" class="form-label">Card Number</label>
                    <input type="text" class="form-control card-number-input" id="cardNumber"
                           pattern="[0-9]{16}" maxlength="16" required
                           placeholder="1234123412341234">
                    <div class="form-text">Enter 16-digit card number without spaces</div>
                </div>

                <div class="mb-3">
                    <label for="creditLimit" class="form-label">Credit Limit ($)</label>
                    <input type="number" class="form-control" id="creditLimit"
                           step="0.01" min="100" required>
                </div>

                <div class="mb-3">
                    <label for="currentBalance" class="form-label">Initial Balance ($)</label>
                    <input type="number" class="form-control" id="currentBalance"
                           step="0.01" value="0" required>
                </div>

                <div class="mb-3">
                    <label for="expiryDate" class="form-label">Expiry Date</label>
                    <input type="month" class="form-control" id="expiryDate" required>
                </div>

                <div class="mb-3">
                    <label for="cardType" class="form-label">Card Type</label>
                    <select class="form-select" id="cardType" required>
                        <option value="">Select card type</option>
                        <option value="Visa">Visa</option>
                        <option value="MasterCard">MasterCard</option>
                        <option value="American Express">American Express</option>
                        <option value="Discover">Discover</option>
                    </select>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-submit">
                        <i class="bi bi-check-circle"></i> Add Credit Card
                    </button>
                    <a href="../CreditCards.html" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Back to Credit Cards
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // API Configuration
        const API_BASE_URL = 'https://localhost:7256/api';
        const CREDIT_CARDS_URL = `${API_BASE_URL}/creditcards`;
        const ACCOUNTS_URL = `${API_BASE_URL}/accounts`;

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function () {
            // Set default expiry date to next month
            const nextMonth = new Date();
            nextMonth.setMonth(nextMonth.getMonth() + 1);
            document.getElementById('expiryDate').value = nextMonth.toISOString().slice(0, 7);

            // Load accounts dropdown
            loadAccounts();

            // Setup form submission
            document.getElementById('createCreditCardForm').addEventListener('submit', handleFormSubmit);

            // Format card number input
            document.getElementById('cardNumber').addEventListener('input', function (e) {
                this.value = this.value.replace(/\D/g, '').slice(0, 16);
            });
        });

        // Load accounts into dropdown
        async function loadAccounts() {
            try {
                showMessage('Loading accounts...', 'info');
                const response = await fetch(ACCOUNTS_URL);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const accounts = await response.json();
                const accountSelect = document.getElementById('accountId');

                // Clear existing options
                accountSelect.innerHTML = '<option value="">Select an account</option>';

                // Add account options
                accounts.forEach(account => {
                    const option = document.createElement('option');
                    option.value = account.id;
                    option.textContent = `${account.accountNumber} (${account.accountType}) - $${account.balance.toFixed(2)}`;
                    accountSelect.appendChild(option);
                });

                // Hide the message when accounts are loaded
                document.getElementById('message').classList.add('d-none');

            } catch (error) {
                showMessage(`Failed to load accounts: ${error.message}`, 'danger');
                console.error('Account loading error:', error);
            }
        }

        // Handle form submission
        async function handleFormSubmit(event) {
            event.preventDefault();

            // Get form elements
            const form = event.target;
            const accountId = form.accountId.value;
            const cardNumber = form.cardNumber.value;
            const creditLimit = parseFloat(form.creditLimit.value);
            const currentBalance = parseFloat(form.currentBalance.value);
            const expiryDate = form.expiryDate.value;
            const cardType = form.cardType.value;

            // Validate inputs
            if (!accountId) {
                showMessage('Please select an account', 'danger');
                return;
            }

            if (!cardNumber || cardNumber.length !== 16) {
                showMessage('Please enter a valid 16-digit card number', 'danger');
                return;
            }

            if (isNaN(creditLimit) || creditLimit < 100) {
                showMessage('Credit limit must be at least $100', 'danger');
                return;
            }

            if (isNaN(currentBalance)) {
                showMessage('Please enter a valid balance', 'danger');
                return;
            }

            if (currentBalance > creditLimit) {
                showMessage('Balance cannot exceed credit limit', 'danger');
                return;
            }

            if (!expiryDate) {
                showMessage('Please select an expiry date', 'danger');
                return;
            }

            if (!cardType) {
                showMessage('Please select a card type', 'danger');
                return;
            }

            // Prepare credit card data
            const creditCardData = {
                accountId: parseInt(accountId),
                cardNumber: cardNumber,
                creditLimit: creditLimit,
                currentBalance: currentBalance,
                expiryDate: expiryDate + '-01', // Add day for proper date parsing
                cardType: cardType
            };

            showMessage('Creating credit card...', 'info');

            // Submit to server
            try {
                const response = await fetch(CREDIT_CARDS_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(creditCardData)
                });

                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                let result;

                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                } else {
                    const text = await response.text();
                    throw new Error(text || 'Invalid server response');
                }

                if (!response.ok) {
                    throw new Error(result.message || 'Credit card creation failed');
                }

                // Success handling
                showMessage(
                    `Credit card added successfully!`,
                    'success'
                );

                // Store a flag in sessionStorage to indicate a new card was created
                sessionStorage.setItem('creditCardCreated', 'true');
                sessionStorage.setItem('creditCardMessage', `Credit card #${result.creditId} created successfully.`);

                // Redirect back to credit cards page after 2 seconds
                setTimeout(() => {
                    window.location.href = '../CreditCards.html';
                }, 2000);

            } catch (error) {
                console.error('Credit card creation error:', error);
                showMessage(
                    `Failed to create credit card: ${error.message}`,
                    'danger'
                );
            }
        }

        // Show message to user
        function showMessage(message, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `alert alert-${type} d-block`;

            // Auto-hide success and info messages after 5 seconds
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    messageEl.classList.add('d-none');
                }, 5000);
            }
        }
    </script>
</body>
</html>
